name: pantry_pal
description: "ExpiryVault - a friendly household expiry tracker for food, medicine, and cosmetics."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local notifications for expiry reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Optional item photo
  image_picker: ^1.1.2

  # Dates and ids
  intl: ^0.19.0
  uuid: ^4.5.1

  # Brand typography (Baloo 2 headings / Nunito body) without bundling font files
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
